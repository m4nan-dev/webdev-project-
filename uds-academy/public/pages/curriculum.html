<head>

<body>

</div>
<div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>Subject</th><th>Credits</th></tr></thead><tbody id="rows"></tbody></table></div>
  </main>
  <div id="footer"></div>
  <script src="../js/api.js"></script>

  <script src="../js/main.js"></script>
