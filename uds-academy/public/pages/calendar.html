<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Calendar | UD&apos;S Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <header class="page-hero"><div class="container"><h1>Academic calendar</h1><p>Classes, exams, and holidays for the year.</p></div></header>

  <main class="container">
    <div class="form-group">
      <label for="month">Month</label>
      <select id="month"></select>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Date</th><th>Event</th><th>Type</th></tr></thead>
        <tbody id="rows"><tr><td colspan="3">Loading calendar...</td></tr></tbody>
      </table>
    </div>
  </main>

  <div id="footer"></div>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/calendar.js"></script>
</body>
</html>
