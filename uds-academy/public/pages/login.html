<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student portal | UD&apos;S Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <header class="page-hero"><div class="container"><h1>Student portal</h1><p>Log in or create an account.</p></div></header>
  <main class="container">

<div class="card narrow">
  <div class="tabs"><button class="tab active" data-tab="login">Log in</button><button class="tab" data-tab="signup">Sign up</button></div>
  <div id="msg"></div>
  <form id="loginForm" novalidate>
    <div class="form-group"><label for="l_email">Email</label><input type="email" id="l_email" name="l_email" ><span class="error-msg"></span></div><div class="form-group"><label for="l_pass">Password</label><input type="password" id="l_pass" name="l_pass" class="pw"><span class="error-msg"></span></div>
    <button class="btn" type="submit">Log in</button>
    <p><small>Demo: student1@udsacademy.com / pass123</small></p>
  </form>
  <form id="signupForm" class="hidden" novalidate>
    <div class="form-group"><label for="s_name">Full name</label><input type="text" id="s_name" name="s_name" ><span class="error-msg"></span></div><div class="form-group"><label for="s_email">Email</label><input type="email" id="s_email" name="s_email" ><span class="error-msg"></span></div>
    <div class="form-group"><label for="s_dept">Department</label><select id="s_dept"></select></div>
    <div class="form-group"><label for="s_pass">Password (6+ characters)</label><input type="password" id="s_pass" name="s_pass" class="pw"><span class="error-msg"></span></div>
    <div class="strength" aria-hidden="true"><i id="bar"></i></div><small id="strengthText"></small>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p><label><input type="checkbox" id="showPw" style="width:auto"> Show password</label></p>
</div>
  </main>
  <div id="footer"></div>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
