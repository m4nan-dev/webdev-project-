<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty | UD&apos;S Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <header class="page-hero"><div class="container"><h1>Our faculty</h1><p>Search by name or filter by department.</p></div></header>

  <main class="container">
    <div class="filters">
      <div class="form-group">
        <label for="search">Search by name</label>
        <input type="search" id="search" placeholder="Type a name">
      </div>
      <div class="form-group">
        <label for="dept">Department</label>
        <select id="dept"><option value="">All departments</option></select>
      </div>
    </div>
    <p id="count" aria-live="polite"></p>
    <div id="list" class="grid grid-3"></div>
  </main>

  <div id="footer"></div>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/faculty.js"></script>
</body>
</html>
