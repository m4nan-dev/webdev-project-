<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | UD&apos;S Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <header class="page-hero"><div class="container"><h1>Dashboard</h1><p>Your attendance and profile.</p></div></header>
  <main class="container">

<div class="card message"><div><h2 id="welcome" style="margin-top:0">Welcome</h2><p id="info"></p><p><a class="btn" href="results.html">View results</a> <button class="btn btn-gold" id="logout">Log out</button></p></div></div>
<div class="grid grid-2">
  <div class="card"><h3>Overall attendance</h3><span class="stat-big" id="attPct">...</span><p id="attWarn"></p></div>
  <div class="card"><h3>Upcoming exams</h3><ul id="exams"><li>Loading...</li></ul></div>
</div>
<h2>Attendance by subject</h2>
<div class="table-wrap"><table class="table"><thead><tr><th>Subject</th><th>Attended</th><th>Total</th><th>Percent</th></tr></thead><tbody id="attRows"></tbody></table></div>
<div class="grid grid-2">
  <form class="card" id="profileForm" novalidate><h3>Edit profile</h3><div id="pMsg"></div><div class="form-group"><label for="p_name">Name</label><input type="text" id="p_name" name="p_name" ><span class="error-msg"></span></div><div class="form-group"><label for="p_phone">Phone (10 digits)</label><input type="tel" id="p_phone" name="p_phone" maxlength="10"><span class="error-msg"></span></div><button class="btn" type="submit">Save profile</button></form>
  <form class="card" id="pwForm" novalidate><h3>Change password</h3><div id="wMsg"></div><div class="form-group"><label for="w_cur">Current password</label><input type="password" id="w_cur" name="w_cur" ><span class="error-msg"></span></div><div class="form-group"><label for="w_new">New password (6+ characters)</label><input type="password" id="w_new" name="w_new" ><span class="error-msg"></span></div><button class="btn" type="submit">Change password</button></form>
</div>
  </main>
  <div id="footer"></div>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
