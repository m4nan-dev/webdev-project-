<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | UD&apos;S Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="admin-head"><strong>UD&apos;S Academy admin</strong><span><a href="../index.html" style="color:#fff">View site</a> <button class="btn btn-gold hidden" id="logout">Log out</button></span></div>
  <div id="loginBox" class="card narrow">
    <h2 style="margin-top:0">Admin login</h2><div id="loginMsg"></div>
    <form id="loginForm"><div class="form-group"><label for="email">Email</label><input id="email" type="email" value="admin@udsacademy.com"></div>
    <div class="form-group"><label for="pass">Password</label><input id="pass" type="password"></div><button class="btn" type="submit">Log in</button></form>
  </div>
  <main class="container hidden" id="app">
    <div class="tabs" id="tabs" style="margin-top:1rem">
      <button class="tab active" data-tab="dash">Dashboard</button><button class="tab" data-tab="announcements">Announcements</button><button class="tab" data-tab="events">Events</button><button class="tab" data-tab="applications">Applications</button><button class="tab" data-tab="messages">Messages</button><button class="tab" data-tab="students">Results and attendance</button>
    </div>
    <div id="panel"></div>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
